<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f1a">
<title>Novira</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--s1:#141a2c;--s2:#1e2644;--t:#eef1f8;--t2:#8b95b0;--b:rgba(255,255,255,.08);--g:linear-gradient(135deg,#ff6b9d,#a855f7 55%,#06b6d4);--me:linear-gradient(135deg,#a855f7,#7c3aed);--ot:rgba(255,255,255,.07);--lk:#7dd3fc;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
[data-th=light]{--bg:#f3f5fb;--s1:#fff;--s2:#e8ecf6;--t:#141a2b;--t2:#667089;--b:rgba(20,26,43,.1);--ot:#fff;--lk:#0369a1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font:15px/1.5 Cairo,system-ui,sans-serif;background:var(--bg);color:var(--t)}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:0}
input,textarea{font-size:16px}
button,label{cursor:pointer}
:focus-visible{outline:2px solid #a855f7;outline-offset:2px}
#app{position:relative;height:100%;height:100dvh;max-width:560px;margin:auto;overflow:hidden;box-shadow:0 0 0 1px var(--b)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--st)}
.scr.on{display:flex}
.pad{flex:1;overflow:auto;padding:22px 20px 110px;display:flex;flex-direction:column;gap:12px}
.ac{align-items:center;text-align:center}
.w{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{width:92px;height:92px;border-radius:32px;background:var(--g);display:grid;place-items:center;font-size:46px;font-weight:900;color:#fff;box-shadow:0 18px 44px rgba(168,85,247,.38)}
.big{font-size:34px;font-weight:900;letter-spacing:-.5px}
.sub{color:var(--t2);font-size:13px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--b);border-radius:16px;width:100%;margin-top:8px}
.tabs button{flex:1;padding:9px;border-radius:12px;font-weight:700;color:var(--t2)}
.tabs .on{background:var(--g);color:#fff}
#fl,#fr{display:flex;flex-direction:column;gap:12px;width:100%}
.inp{text-align:right;width:100%;background:var(--s1);border:1.5px solid var(--b);border-radius:16px;padding:13px 16px;transition:border-color .2s}
.inp:focus{border-color:#a855f7}
.inp[dir=ltr],.inp[type=tel],.inp[type=password]{direction:ltr}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--g);color:#fff;font-weight:800;box-shadow:0 10px 26px rgba(168,85,247,.35);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--s2);color:var(--t);box-shadow:none}
.btn.dg{background:rgba(239,68,68,.14);color:#f87171;box-shadow:none}
.hd{display:flex;align-items:center;gap:10px;padding:16px 20px 6px}
.hd h1{flex:1;font-size:28px;font-weight:900;letter-spacing:-.5px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--s1);border:1px solid var(--b);display:grid;place-items:center;font-size:18px;flex:none}
.av{width:50px;height:50px;border-radius:18px;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;flex:none;object-fit:cover}
.av.xl{width:100px;height:100px;border-radius:34px;font-size:40px;margin:0 auto}
#q{margin:6px 20px 10px;width:calc(100% - 40px)}
#list{flex:1;overflow:auto;padding:0 0 110px}
.ci{display:flex;align-items:center;gap:13px;padding:12px 20px;cursor:pointer;transition:background .15s}
.ci:active,.ci:hover{background:var(--s1)}
.ci+.ci{border-top:1px solid var(--b)}
.ci-i{flex:1;min-width:0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r small,.ch small{color:var(--t2);font-size:11.5px}
.pv{color:var(--t2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--g);color:#fff;font-style:normal;font-size:11px;font-weight:800;min-width:22px;height:22px;padding:0 7px;border-radius:11px;display:grid;place-items:center}
.em{text-align:center;color:var(--t2);padding:56px 24px}
#nav{position:absolute;z-index:20;bottom:calc(12px + var(--sb));left:16px;right:16px;display:flex;gap:4px;padding:6px;background:var(--s1);border:1px solid var(--b);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px;border-radius:18px;color:var(--t2);font-size:11px;font-weight:700}
#nav .on{background:var(--g);color:#fff}
.ch{display:flex;align-items:center;gap:10px;margin:8px 12px 0;padding:9px 10px;background:var(--s1);border:1px solid var(--b);border-radius:24px}
.ch .av{width:42px;height:42px;border-radius:15px;font-size:17px}
#msgs{flex:1;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column}
.day{align-self:center;font-size:11px;color:var(--t2);background:var(--s1);padding:2px 12px;border-radius:10px;margin:10px 0}
.m{max-width:80%;padding:9px 13px;margin-bottom:6px;border-radius:20px;word-break:break-word;white-space:pre-wrap;cursor:pointer;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.me{align-self:flex-start;background:var(--me);color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 20px rgba(124,58,237,.28)}
.ot{align-self:flex-end;background:var(--ot);border:1px solid var(--b);border-bottom-left-radius:6px}
.mt{display:block;text-align:left;font-size:10.5px;opacity:.78;font-style:normal;margin-top:2px;white-space:normal}
.tk.rd{color:#7dd3fc}
.sn{display:block;font-size:12px;color:#a78bfa}
.rq{border-right:3px solid #06b6d4;background:rgba(127,127,127,.2);padding:3px 8px;border-radius:8px;margin-bottom:4px;font-size:12px}
.im{max-width:100%;border-radius:14px;display:block;margin-bottom:4px}
.m a{color:var(--lk)}
.me a{color:#e0f2fe}
#rb{margin:0 12px;padding:8px 12px;background:var(--s1);border:1px solid var(--b);border-right:4px solid #a855f7;border-radius:14px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--t2)}
.cp{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(10px + var(--sb))}
.cp textarea{flex:1;max-height:120px;resize:none;background:var(--s1);border:1px solid var(--b);border-radius:22px;padding:11px 16px}
.snd{width:46px;height:46px;border-radius:17px;background:var(--g);color:#fff;font-size:18px;flex:none;box-shadow:0 8px 22px rgba(168,85,247,.4)}
.sh{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);display:none;align-items:flex-end}
.sh.on{display:flex}
.sc{width:100%;background:var(--s1);border-radius:28px 28px 0 0;padding:14px 18px calc(22px + var(--sb));display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.hd2{width:42px;height:5px;border-radius:3px;background:var(--b);margin:0 auto 6px;flex:none}
.pk{max-height:36vh;overflow:auto}
.pk input{width:20px;height:20px;accent-color:#a855f7}
.vw{position:absolute;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center}
.vw.on{display:flex}
.vw img{max-width:100%;max-height:100%}
#nc{position:absolute;z-index:90;top:0;left:0;right:0;padding:calc(var(--st) + 8px) 14px 8px;background:#7f1d1d;color:#fecaca;font-size:12.5px;text-align:center}
#toast{position:absolute;z-index:99;bottom:100px;left:50%;transform:translate(-50%,30px);background:var(--s2);border:1px solid var(--b);padding:10px 20px;border-radius:16px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

<section id="auth" class="scr on"><div class="pad ac"><div class="w">
 <div class="logo">N</div><h1 class="big">Novira</h1><p class="sub">رسائل بسيطة وسريعة</p>
 <div class="tabs"><button class="on" data-a="au" data-t="l">دخول</button><button data-a="au" data-t="r">حساب جديد</button></div>
 <div id="fl">
  <input id="lp" class="inp" type="tel" placeholder="رقم الهاتف" autocomplete="tel">
  <input id="lk" class="inp" type="password" inputmode="numeric" maxlength="6" placeholder="رمز الدخول (6 أرقام)">
  <button class="btn" data-a="li">دخول</button>
 </div>
 <div id="fr" hidden>
  <input id="rn" class="inp" placeholder="الاسم" maxlength="30">
  <input id="ru" class="inp" dir="ltr" placeholder="username" maxlength="20" autocapitalize="off">
  <input id="rp" class="inp" type="tel" placeholder="رقم الهاتف">
  <input id="rk" class="inp" type="password" inputmode="numeric" maxlength="6" placeholder="رمز الدخول (6 أرقام)">
  <button class="btn" data-a="rg">إنشاء الحساب</button>
 </div>
</div></div></section>

<section id="home" class="scr">
 <div class="hd"><h1>الدردشات</h1><button class="ib" data-a="new" aria-label="محادثة جديدة">✎</button></div>
 <input id="q" class="inp" placeholder="ابحث في المحادثات">
 <div id="list"></div>
</section>

<section id="set" class="scr"><div class="pad">
 <label class="pa"><span id="sa"></span><input id="fa" type="file" accept="image/*" hidden></label>
 <p id="sph" class="sub" style="text-align:center"></p>
 <input id="sn" class="inp" placeholder="الاسم" maxlength="30">
 <input id="su" class="inp" dir="ltr" placeholder="username" maxlength="20" autocapitalize="off">
 <textarea id="sb" class="inp" rows="2" maxlength="150" placeholder="نبذة عنك"></textarea>
 <button class="btn" data-a="sv">حفظ التغييرات</button>
 <button class="btn sec" data-a="th">تبديل المظهر (فاتح / داكن)</button>
 <button class="btn sec" data-a="lo">تسجيل الخروج</button>
 <button class="btn dg" data-a="del">حذف الحساب نهائياً</button>
</div></section>

<section id="chat" class="scr">
 <div class="ch"><button class="ib" data-a="back" aria-label="رجوع">→</button><span id="ca"></span><div class="ci-i"><b id="cn"></b><br><small id="cs"></small></div></div>
 <div id="msgs"></div>
 <div id="rb" hidden></div>
 <div class="cp">
  <label class="ib" aria-label="إرفاق صورة">📎<input id="fi" type="file" accept="image/*" hidden></label>
  <textarea id="in" rows="1" placeholder="اكتب رسالة…"></textarea>
  <button class="snd" data-a="send" aria-label="إرسال">➤</button>
 </div>
</section>

<nav id="nav" hidden>
 <button class="on" data-a="tab" data-t="home">💬<span>الدردشات</span></button>
 <button data-a="tab" data-t="set">⚙️<span>حسابي</span></button>
</nav>

<div id="sh" class="sh"></div>
<div id="vw" class="vw" onclick="this.classList.remove('on')"></div>
<div id="nc" hidden onclick="this.hidden=true"></div>
<div id="toast"></div>
</div>

<script>
const SB='https://bwgetktksxbhrvobjvdb.supabase.co',KEY='sb_publishable_ZQbDTvvCDvc-Eny1Gj1n_w_A9EtdSQy';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let S=null,me=null,chats=[],P={},U={},cur=null,msgs=[],ids=new Set(),sig='',rep=null,edt=null,T={};
try{S=JSON.parse(localStorage.nv_s)}catch{}
try{document.documentElement.dataset.th=localStorage.nv_th||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}catch{}

/* ---------- أدوات ---------- */
const save=s=>{S=s;try{s?localStorage.nv_s=JSON.stringify(s):localStorage.removeItem('nv_s')}catch{}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(T.t);T.t=setTimeout(()=>t.classList.remove('on'),2600)}
const fe=e=>e instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(e.message)?'تعذّر الاتصال بالخادم. افتح التطبيق من موقعك، مو من معاينة الملفات':/could not find the function|schema cache/i.test(e.message)?'قاعدة البيانات غير محدّثة: شغّل ملفي الـ SQL في Supabase':/permission denied|row-level security/i.test(e.message)?'صلاحية مرفوضة من قاعدة البيانات (راجع ملفي الـ SQL)':e.message;
const hs=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const fT=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function dl(t){const d=new Date(t),n=new Date(),k=x=>x.toDateString();return k(d)==k(n)?'اليوم':k(d)==k(new Date(n-864e5))?'أمس':d.toLocaleDateString('en-GB')}
const lk=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const ex=f=>(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
const av=(p,c='')=>p?.avatar_url&&/^https:/.test(p.avatar_url)?`<img class="av ${c}" src="${esc(p.avatar_url)}" alt="">`:`<div class="av ${c}" style="background:hsl(${hs(p?.id)%360} 62% 52%)">${esc((p?.name||'؟').trim()[0]||'؟')}</div>`;
const st=p=>p?.last_seen?(Date.now()-new Date(p.last_seen)<9e4?'متصل الآن':'آخر ظهور '+fT(p.last_seen)):'';

/* ---------- الشبكة ---------- */
async function api(p,o={},r){
 const h={apikey:KEY,'Content-Type':'application/json',...o.h};
 if(S&&!p.includes('/auth/v1/token'))h.Authorization='Bearer '+S.access_token;
 const x=await fetch(SB+p,{method:o.m||'GET',headers:h,body:o.b===undefined?undefined:JSON.stringify(o.b)});
 const t=await x.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}
 if(!x.ok){
  if(!r&&S?.refresh_token&&!p.includes('/auth/v1/token')&&(x.status===401||/jwt/i.test(t))){await refresh();return api(p,o,1)}
  throw new Error(d?.msg||d?.message||d?.error_description||'خطأ '+x.status)
 }
 return d
}
async function refresh(){
 try{save(await api('/auth/v1/token?grant_type=refresh_token',{m:'POST',b:{refresh_token:S.refresh_token}}))}
 catch(e){if(!(e instanceof TypeError))out(1);throw e}
}
const db=(t,q)=>api('/rest/v1/'+t+(q?'?'+q:'')),
 rpc=(n,b)=>api('/rest/v1/rpc/'+n,{m:'POST',b:b||{}}),
 ins=(t,b)=>api('/rest/v1/'+t,{m:'POST',b,h:{Prefer:'return=representation'}}),
 pat=(t,q,b)=>api('/rest/v1/'+t+'?'+q,{m:'PATCH',b,h:{Prefer:'return=minimal'}});
async function up(b,path,f){
 await api('/auth/v1/user').catch(()=>{});
 const x=await fetch(`${SB}/storage/v1/object/${b}/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':f.type||'application/octet-stream','x-upsert':'true'},body:f});
 if(!x.ok)throw new Error('فشل الرفع');
 return `${SB}/storage/v1/object/public/${b}/${path}`
}

/* ---------- التنقل ---------- */
const show=id=>document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));
function go(id){
 show(id);$('#nav').hidden=!(id=='home'||id=='set');
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==id));
 clearInterval(T.h);clearInterval(T.m);
 if(id=='home'){loadChats();T.h=setInterval(loadChats,4000)}
 if(id=='set')fillSet()
}
function sheet(h){$('#sh').innerHTML=`<div class="sc"><i class="hd2"></i>${h}</div>`;$('#sh').classList.add('on')}
const shut=()=>$('#sh').classList.remove('on');

/* ---------- الحساب ---------- */
async function login(){
 const p=$('#lp').value.replace(/\D/g,''),k=$('#lk').value;
 if(p.length<8||!/^\d{6}$/.test(k))return toast('تأكد من الرقم والرمز (6 أرقام)');
 try{save(await api('/auth/v1/token?grant_type=password',{m:'POST',b:{email:p+'@novira.app',password:k}}));boot()}
 catch(e){toast(e instanceof TypeError?fe(e):'الرقم أو الرمز غير صحيح')}
}
async function reg(){
 const n=$('#rn').value.trim(),u=$('#ru').value.trim().toLowerCase(),p=$('#rp').value.replace(/\D/g,''),k=$('#rk').value;
 if(n.length<2)return toast('الاسم قصير');
 if(!/^[a-z0-9_]{3,20}$/.test(u))return toast('اسم المستخدم: 3-20 حرف إنجليزي أو رقم أو _');
 if(p.length<8||!/^\d{6}$/.test(k))return toast('تأكد من الرقم والرمز (6 أرقام)');
 try{
  if(!await rpc('username_available',{p_username:u}))return toast('اسم المستخدم محجوز');
  const em=p+'@novira.app';
  let r=await api('/auth/v1/signup',{m:'POST',b:{email:em,password:k,data:{name:n,phone:p,username:u}}});
  if(!r.access_token)r=await api('/auth/v1/token?grant_type=password',{m:'POST',b:{email:em,password:k}});
  save(r);boot()
 }catch(e){toast(/already|registered/i.test(e.message)?'الرقم مسجّل مسبقاً':/database/i.test(e.message)?'اسم المستخدم محجوز':fe(e))}
}
async function boot(){
 me=S.user;
 try{P[me.id]=(await db('profiles','select=id,name,username,avatar_url,bio,last_seen&id=eq.'+me.id))[0]}
 catch(e){if(!(e instanceof TypeError)){out(1);return}}
 P[me.id]=P[me.id]||{id:me.id,name:me.user_metadata?.name||'أنا',username:me.user_metadata?.username||''};
 go('home');online();clearInterval(T.o);T.o=setInterval(online,6e4)
}
function out(q){
 const t=S?.access_token;save(null);me=null;cur=null;chats=[];P={};U={};
 Object.values(T).forEach(clearInterval);
 if(!q&&t)fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t}}).catch(()=>{});
 $('#nav').hidden=true;show('auth')
}
const online=()=>me&&pat('profiles','id=eq.'+me.id,{last_seen:new Date().toISOString()}).catch(()=>{});

/* ---------- قائمة المحادثات ---------- */
const oth=c=>c.user1_id==me.id?c.user2_id:c.user1_id,
 nm=c=>c.is_group?c.group_name:(P[oth(c)]?.name||'مستخدم');
async function prof(a){
 const n=[...new Set(a)].filter(i=>i&&!P[i]);
 if(n.length)(await db('profiles','select=id,name,username,avatar_url,last_seen&id=in.('+n.join(',')+')')).forEach(p=>P[p.id]=p)
}
async function loadChats(){
 try{
  const cs=await db('chats','select=*&order=last_message_at.desc.nullslast');
  await prof(cs.filter(c=>!c.is_group).map(oth));
  U={};try{(await rpc('my_unread_counts')).forEach(r=>U[r.chat_id]=r.unread)}catch{}
  chats=cs;list()
 }catch{}
}
function list(){
 const q=$('#q').value.trim().toLowerCase(),a=chats.filter(c=>nm(c).toLowerCase().includes(q));
 $('#list').innerHTML=a.map(c=>{const u=U[c.id];return `<div class="ci" data-a="open" data-id="${c.id}">${c.is_group?'<div class="av">👥</div>':av(P[oth(c)])}<div class="ci-i"><div class="r"><b>${esc(nm(c))}</b><small>${c.last_message_at?fT(c.last_message_at):''}</small></div><div class="r"><span class="pv">${esc(c.last_message||'ابدأ المحادثة')}</span>${u?`<i class="bd">${u>99?'99+':u}</i>`:''}</div></div></div>`}).join('')||'<p class="em">ما في محادثات بعد.<br>اضغط ✎ لتبدأ محادثة أو مجموعة.</p>'
}

/* ---------- المحادثة ---------- */
async function openChat(id){
 const c=chats.find(x=>x.id==id);if(!c)return;
 cur=c;msgs=[];ids=new Set();sig='';rep=edt=null;rb();$('#in').value='';
 $('#cn').textContent=nm(c);$('#cs').textContent=c.is_group?'مجموعة':st(P[oth(c)]);
 $('#ca').innerHTML=c.is_group?'<div class="av">👥</div>':av(P[oth(c)]);
 $('#msgs').innerHTML='';go('chat');
 await poll(1);T.m=setInterval(poll,2500)
}
async function poll(f){
 const c=cur;if(!c)return;
 try{
  const d=(await db('messages',`chat_id=eq.${c.id}&select=*&order=created_at.desc&limit=60`)).reverse();
  if(cur!==c)return;
  const s=d.map(m=>m.id+(m.read_by||[]).length+(m.edited_at||'')+(m.deleted_at||'')).join();
  if(s==sig&&!f)return;sig=s;
  const nw=d.some(m=>!ids.has(m.id)&&m.sender_id!=me.id);
  d.forEach(m=>ids.add(m.id));msgs=d;
  await prof(d.map(m=>m.sender_id));
  draw(f);
  if(nw||f==1)rpc('mark_chat_read',{p_chat:c.id}).catch(()=>{})
 }catch{}
}
function draw(f){
 const b=$('#msgs'),near=b.scrollHeight-b.scrollTop-b.clientHeight<140;let h='',ld='';
 msgs.forEach(m=>{
  const d=dl(m.created_at);if(d!=ld){h+=`<div class="day">${d}</div>`;ld=d}
  const mine=m.sender_id==me.id,rc=(m.read_by||[]).length;
  let q='';if(m.reply_to){try{q=`<div class="rq">${esc(JSON.parse(m.reply_to).text)}</div>`}catch{}}
  const bd=m.deleted_at?'<em>🚫 تم حذف الرسالة</em>':m.type=='image'?`<img class="im" data-a="img" src="${esc(m.media_url)}" loading="lazy" alt="">${m.text?lk(m.text):''}`:m.type=='audio'?'🎤 رسالة صوتية':m.type=='call'?'📞 مكالمة':lk(m.text);
  const sn=cur.is_group&&!mine?`<b class="sn">${esc(P[m.sender_id]?.name||'')}</b>`:'';
  const tk=mine&&!m.deleted_at?`<span class="tk${rc?' rd':''}">${rc?'✓✓':'✓'}</span>`:'';
  h+=`<div class="m ${mine?'me':'ot'}" data-a="mm" data-id="${m.id}">${sn}${q}${bd}<i class="mt">${m.edited_at?'معدّلة · ':''}${fT(m.created_at)} ${tk}</i></div>`
 });
 b.innerHTML=h;if(f||near)b.scrollTop=b.scrollHeight
}
function rb(){
 const b=$('#rb'),on=rep||edt;b.hidden=!on;
 b.innerHTML=on?`<span>${edt?'✏️ تعديل الرسالة':'↩️ '+esc(rep.text)}</span><button data-a="rx" aria-label="إلغاء">✕</button>`:''
}
const gm=e=>msgs.find(x=>x.id==e.dataset.id);

/* ---------- الإجراءات ---------- */
const A={
 au:e=>{const l=e.dataset.t=='l';$('#fl').hidden=!l;$('#fr').hidden=l;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b==e))},
 li:login,rg:reg,
 tab:e=>go(e.dataset.t),
 open:e=>openChat(e.dataset.id),
 back:()=>{cur=null;go('home')},
 new:()=>sheet('<b>محادثة جديدة</b><input id="nq" class="inp" dir="ltr" placeholder="@username أو رقم الهاتف"><button class="btn" data-a="mk">ابدأ المحادثة</button><button class="btn sec" data-a="grp">إنشاء مجموعة</button>'),
 mk:async()=>{
  const v=$('#nq').value.trim().replace(/^@/,'').toLowerCase();if(!v)return;
  try{
   const u=/^\+?[\d\s-]{6,}$/.test(v)?(await rpc('find_user_by_phone',{p_phone:v}))[0]:(await db('profiles','select=id,name,username,avatar_url,last_seen&username=eq.'+encodeURIComponent(v)))[0];
   if(!u)return toast('ما لقيت مستخدم بهالمعلومة');
   if(u.id==me.id)return toast('هذا حسابك 😄');
   P[u.id]=u;
   let c=chats.find(x=>!x.is_group&&oth(x)==u.id);
   if(!c)try{c=(await ins('chats',{user1_id:me.id,user2_id:u.id}))[0];chats.unshift(c)}catch{await loadChats();c=chats.find(x=>!x.is_group&&oth(x)==u.id)}
   shut();openChat(c.id)
  }catch(x){toast(fe(x))}
 },
 grp:()=>{
  const cs=chats.filter(c=>!c.is_group);
  sheet(`<b>مجموعة جديدة</b><input id="gn" class="inp" placeholder="اسم المجموعة" maxlength="40"><div class="pk">${cs.map(c=>`<label class="ci">${av(P[oth(c)])}<b class="ci-i">${esc(nm(c))}</b><input type="checkbox" value="${oth(c)}"></label>`).join('')||'<p class="em">ابدأ محادثات فردية أولاً لتضيف أعضاء.</p>'}</div><button class="btn" data-a="mg">إنشاء المجموعة</button>`)
 },
 mg:async()=>{
  const n=$('#gn').value.trim(),m=[...document.querySelectorAll('.pk input:checked')].map(i=>i.value);
  if(n.length<2||!m.length)return toast('اكتب اسماً واختر عضواً واحداً على الأقل');
  try{const id=await rpc('create_group',{p_name:n,p_members:m});shut();await loadChats();openChat(id)}catch(x){toast(fe(x))}
 },
 send:async()=>{
  const i=$('#in'),t=i.value.trim();if(!t||!cur)return;
  try{
   if(edt)await pat('messages','id=eq.'+edt,{text:t});
   else{const b={chat_id:cur.id,sender_id:me.id,text:t,type:'text'};if(rep)b.reply_to=JSON.stringify(rep);await ins('messages',b)}
   i.value='';i.style.height='auto';rep=edt=null;rb();poll(2)
  }catch(e){toast(fe(e))}
 },
 mm:e=>{
  const m=gm(e);if(!m||m.deleted_at)return;const mine=m.sender_id==me.id,id=`data-id="${m.id}"`;
  sheet(`<button class="btn sec" data-a="rp" ${id}>↩️ رد</button>${m.type=='text'?`<button class="btn sec" data-a="cp" ${id}>📋 نسخ</button>`:''}${mine&&m.type=='text'?`<button class="btn sec" data-a="ed" ${id}>✏️ تعديل</button>`:''}${mine?`<button class="btn dg" data-a="dm" ${id}>🗑️ حذف للجميع</button>`:''}`)
 },
 rp:e=>{const m=gm(e);rep={id:m.id,text:(m.text||'📷 صورة').slice(0,80)};edt=null;shut();rb();$('#in').focus()},
 cp:e=>{navigator.clipboard?.writeText(gm(e).text);shut();toast('تم النسخ ✓')},
 ed:e=>{const m=gm(e);edt=m.id;rep=null;shut();rb();$('#in').value=m.text;$('#in').focus()},
 dm:async e=>{shut();try{await rpc('delete_message_for_all',{p_message:e.dataset.id});poll(2)}catch(x){toast(fe(x))}},
 rx:()=>{rep=edt=null;$('#in').value='';rb()},
 img:e=>{$('#vw').innerHTML=`<img src="${esc(e.src)}" alt="">`;$('#vw').classList.add('on')},
 sv:async()=>{
  const n=$('#sn').value.trim(),u=$('#su').value.trim().toLowerCase(),b=$('#sb').value.trim();
  if(n.length<2||!/^[a-z0-9_]{3,20}$/.test(u))return toast('الاسم أو اسم المستخدم غير صالح');
  try{await pat('profiles','id=eq.'+me.id,{name:n,username:u,bio:b});Object.assign(P[me.id],{name:n,username:u,bio:b});fillSet();toast('✓ تم الحفظ')}
  catch(e){toast(/duplicate|unique/i.test(e.message)?'اسم المستخدم محجوز':fe(e))}
 },
 th:()=>{const d=document.documentElement,l=d.dataset.th=='light'?'dark':'light';d.dataset.th=l;try{localStorage.nv_th=l}catch{}$('meta[name=theme-color]').content=l=='light'?'#f3f5fb':'#0b0f1a'},
 lo:()=>confirm('تسجيل الخروج؟')&&out(),
 del:async()=>{
  if(prompt('هذا الإجراء نهائي. اكتب «حذف» للتأكيد')!=='حذف')return;
  try{await rpc('delete_my_account');out(1);toast('تم حذف الحساب')}catch(e){toast(fe(e))}
 }
};
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-a]');
 if(!a||e.target.closest('a'))return;
 if(A[a.dataset.a])A[a.dataset.a](a)
});
$('#sh').onclick=e=>{if(e.target.id=='sh')shut()};
$('#auth').onkeydown=e=>{if(e.key=='Enter')($('#fl').hidden?reg:login)()};
$('#q').oninput=list;
$('#in').oninput=function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'};
$('#in').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();A.send()}};

/* ---------- الإعدادات والصور ---------- */
function fillSet(){
 const p=P[me.id]||{};
 $('#sa').innerHTML=av(p,'xl');$('#sph').textContent=p.username?'@'+p.username+' · اضغط الصورة لتغييرها':'اضغط الصورة لتغييرها';
 $('#sn').value=p.name||'';$('#su').value=p.username||'';$('#sb').value=p.bio||''
}
$('#fa').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';
 if(!f||!f.type.startsWith('image/')||f.size>5e6)return toast('اختر صورة حتى 5MB');
 try{const u=await up('media',`avatars/${me.id}_${Date.now()}.${ex(f)}`,f);await pat('profiles','id=eq.'+me.id,{avatar_url:u});P[me.id].avatar_url=u;fillSet();toast('✓ تم تحديث الصورة')}
 catch(x){toast(fe(x))}
};
$('#fi').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f||!cur)return;
 if(!f.type.startsWith('image/')||f.size>15e6)return toast('اختر صورة حتى 15MB');
 try{
  toast('جاري الرفع…');
  const u=await up('media',`${me.id}/${Date.now()}.${ex(f)}`,f);
  await ins('messages',{chat_id:cur.id,sender_id:me.id,type:'image',media_url:u,media_type:f.type,text:$('#in').value.trim()});
  $('#in').value='';poll(2)
 }catch(x){toast(fe(x))}
};

/* ---------- تشغيل ---------- */
function ping(){fetch(SB+'/auth/v1/health',{headers:{apikey:KEY}}).then(()=>$('#nc').hidden=true).catch(()=>{$('#nc').textContent='لا يوجد اتصال بالخادم (معاينة Claude تمنع الشبكة، افتحه من موقعك). اضغط للإخفاء';$('#nc').hidden=false})}
ping();addEventListener('online',ping);
visualViewport?.addEventListener('resize',()=>{if(cur){const b=$('#msgs');b.scrollTop=b.scrollHeight}});
S?boot():show('auth');
</script>
</body>
</html>
