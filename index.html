<script>

 cm:()=>{
  const c=cur,o=P[oth(c)];
  sheet(`<div class="ctr">${avc(c,'xl')}<b>${esc(nm(c))}</b>${c.is_group?'':`<small dir="ltr">@${esc(o?.username||'')}</small>`}${!c.is_group&&o?.bio?`<p>${esc(o.bio)}</p>`:''}</div><button class="row" data-a="fv">${F.has(c.id)?'⭐ إزالة من المفضلة':'☆ إضافة للمفضلة'}</button>${c.is_group?'<button class="row" data-a="gi">ℹ️ معلومات المجموعة والأعضاء</button>':`<button class="row dg" data-a="bl">${B.has(oth(c))?'✅ إلغاء الحظر':'🚫 حظر المستخدم'}</button>`}`)
 },
 fv:async()=>{
  const id=cur.id;shut();
  try{if(F.has(id)){await rm('favorites',`user_id=eq.${me.id}&target_type=eq.chat&target_id=eq.${id}`);F.delete(id)}else{await ins('favorites',{user_id:me.id,target_type:'chat',target_id:id});F.add(id)}toast(F.has(id)?'★ أُضيفت للمفضلة':'أُزيلت من المفضلة')}catch(x){toast(fe(x))}
 },
 bl:async()=>{
  if(!cur||cur.is_group)return;const o=oth(cur);shut();
  try{
   if(B.has(o)){await rm('blocks',`blocker_id=eq.${me.id}&blocked_id=eq.${o}`);B.delete(o)}
   else{if(!confirm('حظر هذا المستخدم؟'))return;await ins('blocks',{blocker_id:me.id,blocked_id:o});B.add(o)}
   perm();toast('✓')
  }catch(x){toast(fe(x))}
 },
 bk:async()=>{
  const a=[...B];try{await prof(a)}catch{}
  sheet(`<b>المحظورون</b>${a.map(i=>`<div class="ci">${av(P[i])}<b class="ci-i">${esc(P[i]?.name||'')}</b><button class="chip" data-a="ub" data-id="${i}">إلغاء الحظر</button></div>`).join('')||'<p class="em">لا أحد محظور</p>'}`)
 },
 ub:async e=>{try{await rm('blocks',`blocker_id=eq.${me.id}&blocked_id=eq.${e.dataset.id}`);B.delete(e.dataset.id);A.bk()}catch(x){toast(fe(x))}},
 pc:e=>{
  const u=P[e.dataset.id];if(!u)return;
  sheet(`<div class="ctr">${av(u,'xl')}<b>${esc(u.name)}</b><small dir="ltr">@${esc(u.username||'')}</small><p>${esc(u.bio||'')}</p></div><button class="btn" data-a="dmu" data-id="${u.id}">💬 مراسلة</button>`)
 },
 dmu:e=>dm(P[e.dataset.id]),
 gi:async()=>{
  try{await loadMem()}catch(x){return toast(fe(x))}
  const c=cur,adm=myRole=='owner'||myRole=='admin',rl={owner:'👑 المالك',admin:'⭐ مشرف'};
  mem.sort((a,b)=>'oam'.indexOf(a.role[0])-'oam'.indexOf(b.role[0]));
  sheet(`<div class="ctr">${gav(c,'xl')}<b>${esc(c.group_name)}</b><small>${mem.length} عضو</small></div>${myEdit?'<button class="row" data-a="gn">✏️ تغيير الاسم</button><label class="row">🖼️ تغيير الصورة<input type="file" accept="image/*" hidden id="fg"></label>':''}${adm?`<button class="row" data-a="ao">🔒 الكتابة: ${c.only_admins_can_send?'المشرفون فقط':'الجميع'} — تبديل</button><button class="row" data-a="am">➕ إضافة أعضاء</button>`:''}<div class="pk">${mem.map(m=>`<div class="ci" data-a="mb" data-id="${m.user_id}">${av(P[m.user_id])}<div class="ci-i"><b>${esc(P[m.user_id]?.name||'')}${m.user_id==me.id?' (أنت)':''}</b><br><small>${rl[m.role]||(m.can_send===false?'🔒 قارئ':'عضو')}</small></div></div>`).join('')}</div>${myRole=='owner'?'<button class="row dg" data-a="gd">🗑️ حذف المجموعة</button>':'<button class="row dg" data-a="gl">🚪 مغادرة المجموعة</button>'}`)
 },
 mb:e=>{
  const m=mem.find(x=>x.user_id==e.dataset.id);if(!m||m.user_id==me.id)return;
  const own=myRole=='owner',adm=own||myRole=='admin',i=`data-id="${m.user_id}"`,u=P[m.user_id]||{};
  sheet(`<div class="ctr">${av(u,'xl')}<b>${esc(u.name||'')}</b></div><button class="row" data-a="pc" ${i}>👤 عرض الملف</button>${own&&m.role!='owner'?`<button class="row" data-a="mr" data-r="${m.role=='admin'?'member':'admin'}" ${i}>${m.role=='admin'?'⬇️ تنزيل لعضو':'⭐ ترقية لمشرف'}</button>`:''}${adm&&m.role=='member'?`<button class="row" data-a="mc" ${i}>${m.can_send===false?'✏️ السماح بالكتابة':'🔒 منع الكتابة'}</button>`:''}${own?`<button class="row" data-a="mt" ${i}>👑 نقل الملكية له</button>`:''}${(own&&m.role!='owner')||(adm&&m.role=='member')?`<button class="row dg" data-a="mk2" ${i}>🚫 طرد من المجموعة</button>`:''}`)
 },
 mr:e=>mop(()=>pat('chat_members',`chat_id=eq.${cur.id}&user_id=eq.${e.dataset.id}`,{role:e.dataset.r})),
 mc:e=>{const m=mem.find(x=>x.user_id==e.dataset.id);return mop(()=>pat('chat_members',`chat_id=eq.${cur.id}&user_id=eq.${m.user_id}`,{can_send:m.can_send===false}))},
 mt:e=>confirm('نقل ملكية المجموعة لهذا العضو؟')&&mop(()=>rpc('transfer_group_ownership',{p_chat:cur.id,p_new_owner:e.dataset.id})),
 mk2:e=>confirm('طرد هذا العضو؟')&&mop(()=>rm('chat_members',`chat_id=eq.${cur.id}&user_id=eq.${e.dataset.id}`)),
 ao:()=>mop(async()=>{const v=!cur.only_admins_can_send;await pat('chats','id=eq.'+cur.id,{only_admins_can_send:v});cur.only_admins_can_send=v}),
 gn:async()=>{
  const n=prompt('اسم المجموعة',cur.group_name);if(!n||n.trim().length<2)return;
  try{await pat('chats','id=eq.'+cur.id,{group_name:n.trim()});cur.group_name=n.trim();$('#cn').textContent=cur.group_name;A.gi()}catch(x){toast(fe(x))}
 },
 am:()=>{
  const have=new Set(mem.map(m=>m.user_id)),a=chats.filter(c=>!c.is_group&&!have.has(oth(c)));
  sheet(`<b>إضافة أعضاء</b><div class="pk">${a.map(c=>`<label class="ci">${av(P[oth(c)])}<b class="ci-i">${esc(nm(c))}</b><input type="checkbox" value="${oth(c)}"></label>`).join('')||'<p class="em">ما في جهات إضافية</p>'}</div><button class="btn" data-a="am2">إضافة</button>`)
 },
 am2:()=>{const a=$$('.pk input:checked').map(i=>i.value);if(a.length)mop(()=>ins('chat_members',a.map(u=>({chat_id:cur.id,user_id:u,role:'member'}))))},
 gl:async()=>{if(!confirm('مغادرة المجموعة؟'))return;try{await rm('chat_members',`chat_id=eq.${cur.id}&user_id=eq.${me.id}`);shut();A.back()}catch(x){toast(fe(x))}},
 gd:async()=>{if(!confirm('حذف المجموعة نهائياً؟'))return;try{await rpc('delete_group',{p_chat:cur.id});shut();A.back()}catch(x){toast(fe(x))}},
 sv:async()=>{
  const n=$('#sn').value.trim(),u=$('#su').value.trim().toLowerCase(),b=$('#sb').value.trim();
  if(n.length<2||!/^[a-z0-9_]{3,20}$/.test(u))return toast('الاسم أو اسم المستخدم غير صالح');
  try{await pat('profiles','id=eq.'+me.id,{name:n,username:u,bio:b});Object.assign(P[me.id],{name:n,username:u,bio:b});fillSet();toast('✓ تم الحفظ')}
  catch(e){toast(/duplicate|unique/i.test(e.message)?'اسم المستخدم محجوز':fe(e))}
 },
 qr:()=>{
  const u=PUB+'?u='+(P[me.id].username||'');
  sheet(`<div class="ctr"><div id="qc" style="padding:10px;background:#fff;border-radius:18px"></div><b>@${esc(P[me.id].username||'')}</b><small dir="ltr">${esc(u)}</small></div><button class="btn" data-a="shr" data-u="${esc(u)}">📤 مشاركة الرابط</button><button class="btn sec" data-a="cpl" data-u="${esc(u)}">📋 نسخ الرابط</button>`);
  loadQR(u)
 },
 shr:e=>navigator.share?navigator.share({title:'Novira',url:e.dataset.u}).catch(()=>{}):cpy(e.dataset.u),
 cpl:e=>cpy(e.dataset.u),
 lo:()=>confirm('تسجيل الخروج؟')&&out(),
 del:async()=>{
  if(prompt('هذا الإجراء نهائي. اكتب «حذف» للتأكيد')!=='حذف')return;
  try{await rpc('delete_my_account');out(1);toast('تم حذف الحساب')}catch(e){toast(fe(e))}
 }
};
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-a]');
 if(!a||e.target.closest('a'))return;
 if(A[a.dataset.a])A[a.dataset.a](a)
});
document.addEventListener('change',async e=>{
 if(e.target.id!='fg')return;const f=e.target.files[0];
 if(!f||!f.type.startsWith('image/')||f.size>5e6)return toast('اختر صورة حتى 5MB');
 try{const u=await up('media',`groups/${cur.id}.${ex(f)}`,f)+'?t='+Date.now();await pat('chats','id=eq.'+cur.id,{group_avatar_url:u});cur.group_avatar_url=u;$('#ca').innerHTML=avc(cur);A.gi()}catch(x){toast(fe(x))}
});
$('#sh').onclick=e=>{if(e.target.id=='sh')shut()};
$('#auth').onkeydown=e=>{if(e.key=='Enter')($('#fl').hidden?reg:login)()};
$('#q').oninput=list;
$('#in').oninput=function(){
 this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';snd();
 if(cur&&!cur.is_group&&Date.now()-typT>2500){typT=Date.now();ups('typing_status','chat_id,user_id',{chat_id:cur.id,user_id:me.id,updated_at:new Date().toISOString()}).catch(()=>{})}
};
$('#in').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();if($('#in').value.trim())sendTxt()}};

/* ---------- الإعدادات والصور ---------- */
function fillSet(){
 const p=P[me.id]||{};
 $('#sa').innerHTML=av(p,'xl');$('#sph').textContent=p.username?'@'+p.username+' · اضغط الصورة لتغييرها':'اضغط الصورة لتغييرها';
 $('#sn').value=p.name||'';$('#su').value=p.username||'';$('#sb').value=p.bio||''
}
$('#fa').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';
 if(!f||!f.type.startsWith('image/')||f.size>5e6)return toast('اختر صورة حتى 5MB');
 try{const u=await up('media',`avatars/${me.id}_${Date.now()}.${ex(f)}`,f);await pat('profiles','id=eq.'+me.id,{avatar_url:u});P[me.id].avatar_url=u;fillSet();toast('✓ تم تحديث الصورة')}
 catch(x){toast(fe(x))}
};
$('#fi').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f||!cur)return;
 if(!f.type.startsWith('image/')||f.size>15e6)return toast('اختر صورة حتى 15MB');
 try{
  toast('جاري الرفع…');
  const u=await up('media',`${me.id}/${Date.now()}.${ex(f)}`,f);
  await ins('messages',{chat_id:cur.id,sender_id:me.id,type:'image',media_url:u,media_type:f.type,text:$('#in').value.trim()});
  $('#in').value='';snd();poll(2)
 }catch(x){toast(fe(x))}
};

/* ---------- تشغيل ---------- */
function ping(){fetch(SB+'/auth/v1/health',{headers:{apikey:KEY}}).then(()=>$('#nc').hidden=true).catch(()=>{$('#nc').textContent='لا يوجد اتصال بالخادم (معاينة Claude تمنع الشبكة، افتحه من موقعك). اضغط للإخفاء';$('#nc').hidden=false})}
ping();addEventListener('online',ping);
visualViewport?.addEventListener('resize',()=>{if(cur){const b=$('#msgs');b.scrollTop=b.scrollHeight}});
setTimeout(()=>$('#sp').classList.add('off'),1000);
S?boot():show('auth');
</script>
