<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novira</title>
<style>
:root{--bg:#fbf8f3;--w:#fff;--ink:#1d2a33;--mut:#7b8791;--ln:rgba(29,42,51,.09);--pri:#0e9f8e;--sand:#efe9df;--g:linear-gradient(135deg,#17c3a5,#0b7f8f)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;text-align:center}
h1{font-size:34px;color:var(--pri);margin:20px 0 6px}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--sand);border-radius:16px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:12px;font-weight:700;color:var(--mut);background:none;border:0;font:inherit}
.tabs .on{background:var(--w);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.inp{width:100%;background:var(--w);border:1.5px solid var(--ln);border-radius:16px;padding:13px 16px;margin-bottom:10px;font:inherit;font-size:16px;text-align:left;direction:ltr}
.inp:focus{border-color:var(--pri);outline:0}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--g);color:#fff;font-weight:800;border:0;font:inherit;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.98)}
.form{display:none;flex-direction:column}
.form.on{display:flex}
.logo{font-size:70px}
#msg{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0e9f8e;color:#fff;padding:10px 20px;border-radius:16px;font-weight:700;font-size:13px;display:none;max-width:90%;text-align:center}
#msg.err{background:#d6336c}
</style>
</head>
<body>
<div class="box">
  <div class="logo">💬</div>
  <h1>Novira</h1>
  <p class="sub">دردشة بنكهة جديدة ✦</p>
  <div class="tabs">
    <button id="tabLogin" class="on">دخول</button>
    <button id="tabReg">حساب جديد</button>
  </div>
  <div class="form on" id="formLogin">
    <input id="lp" class="inp" type="tel" placeholder="رقم الهاتف">
    <input id="lk" class="inp" type="password" inputmode="numeric" maxlength="6" placeholder="رمز الدخول (6 أرقام)">
    <button class="btn" id="btnLogin">دخول</button>
  </div>
  <div class="form" id="formReg">
    <input id="rn" class="inp" placeholder="الاسم" maxlength="30">
    <input id="ru" class="inp" type="text" placeholder="username" maxlength="20">
    <input id="rp" class="inp" type="tel" placeholder="رقم الهاتف">
    <input id="rk" class="inp" type="password" inputmode="numeric" maxlength="6" placeholder="رمز الدخول (6 أرقام)">
    <button class="btn" id="btnReg">إنشاء الحساب</button>
  </div>
</div>
<div id="msg"></div>
<script>
console.log('نوفيرا: بدأ التحميل');

const SB='https://bwgetktksxbhrvobjvdb.supabase.co';
const KEY='sb_publishable_ZQbDTvvCDvc-Eny1Gj1n_w_A9EtdSQy';

function msg(t,err){
  const m=document.getElementById('msg');
  m.textContent=t;
  m.className=err?'err':'';
  m.style.display='block';
  setTimeout(()=>m.style.display='none',3000);
}

document.getElementById('tabLogin').onclick=()=>{
  document.getElementById('tabLogin').classList.add('on');
  document.getElementById('tabReg').classList.remove('on');
  document.getElementById('formLogin').classList.add('on');
  document.getElementById('formReg').classList.remove('on');
};
document.getElementById('tabReg').onclick=()=>{
  document.getElementById('tabReg').classList.add('on');
  document.getElementById('tabLogin').classList.remove('on');
  document.getElementById('formReg').classList.add('on');
  document.getElementById('formLogin').classList.remove('on');
};

async function api(path,opt={}){
  const h={'Content-Type':'application/json',apikey:KEY,...opt.h};
  const r=await fetch(SB+path,{
    method:opt.m||'GET',
    headers:h,
    body:opt.b?JSON.stringify(opt.b):undefined
  });
  const t=await r.text();
  let d=null;try{d=t?JSON.parse(t):null}catch{d=t}
  if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||'خطأ '+r.status);
  return d;
}

document.getElementById('btnLogin').onclick=async()=>{
  const p=document.getElementById('lp').value.replace(/\D/g,'');
  const k=document.getElementById('lk').value;
  if(p.length<8||k.length!==6){msg('الرقم 8 أرقام والرمز 6 أرقام',1);return}
  msg('جاري الدخول…');
  try{
    const r=await api('/auth/v1/token?grant_type=password',{
      m:'POST',
      b:{email:p+'@novira.app',password:k}
    });
    msg('✅ تم الدخول بنجاح! مرحبا '+(r.user?.user_metadata?.name||''));
    localStorage.setItem('nv_user',JSON.stringify(r.user));
    setTimeout(()=>{
      msg('تم حفظ الجلسة. الآن جاهز لاستخدام التطبيق الكامل.');
    },1500);
  }catch(e){
    msg('❌ '+e.message,1);
  }
};

document.getElementById('btnReg').onclick=async()=>{
  const n=document.getElementById('rn').value.trim();
  const u=document.getElementById('ru').value.trim().toLowerCase();
  const p=document.getElementById('rp').value.replace(/\D/g,'');
  const k=document.getElementById('rk').value;
  if(n.length<2){msg('الاسم قصير',1);return}
  if(!/^[a-z0-9_]{3,20}$/.test(u)){msg('اسم المستخدم غير صالح',1);return}
  if(p.length<8||k.length!==6){msg('الرقم 8 أرقام والرمز 6 أرقام',1);return}
  msg('جاري التسجيل…');
  try{
    const r=await api('/auth/v1/signup',{
      m:'POST',
      b:{email:p+'@novira.app',password:k,data:{name:n,phone:p,username:u}}
    });
    msg('✅ تم التسجيل!');
    if(r.access_token){
      localStorage.setItem('nv_user',JSON.stringify(r.user));
      setTimeout(()=>msg('تم حفظ الجلسة. جاهز للدخول.'),1500);
    }else{
      setTimeout(()=>msg('تم التسجيل. سجّل الدخول الآن.'),1500);
    }
  }catch(e){
    msg('❌ '+e.message,1);
  }
};

console.log('نوفيرا: جاهز');
</script>
</body>
</html>
