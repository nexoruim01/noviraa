<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content,user-scalable=no,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f1a">
<title>Novira</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ═══════════════ المتغيرات ═══════════════ */
:root{
  --bg:#0b0f1a;--s1:#141a2c;--s2:#1e2644;
  --t:#eef1f8;--t2:#8b95b0;--t3:#5a6585;
  --b:rgba(255,255,255,.08);--b2:rgba(255,255,255,.14);
  --g:linear-gradient(135deg,#ff6b9d,#a855f7 55%,#06b6d4);
  --me:linear-gradient(135deg,#a855f7,#7c3aed);
  --ot:rgba(255,255,255,.07);
  --pu:#a855f7;--cy:#06b6d4;--lk:#7dd3fc;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
[data-th=light]{
  --bg:#f3f5fb;--s1:#fff;--s2:#e8ecf6;
  --t:#141a2b;--t2:#667089;--t3:#8891a5;
  --b:rgba(20,26,43,.1);--b2:rgba(20,26,43,.15);
  --ot:#fff;--lk:#0369a1;
}

/* ═══════════════ Reset ═══════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{
  -webkit-touch-callout:none;   /* ⚡ منع قائمة "الضغط المطور" */
  -webkit-user-select:none;      /* ⚡ منع التحديد والنسخ بدون زر */
  user-select:none;
}
input,textarea{
  -webkit-user-select:text;      /* ⚡ السماح بالكتابة */
  user-select:text;
  -webkit-touch-callout:default;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;position:fixed;inset:0}
body{
  font:15px/1.5 Cairo,system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--t);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{
  font:inherit;color:inherit;border:0;background:none;outline:0;
}
input,textarea{font-size:16px}
button,label{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--pu);outline-offset:2px}
::selection{background:rgba(168,85,247,.35)}

/* ═══════════════ App Shell ═══════════════ */
#app{
  position:relative;height:100%;height:100dvh;
  max-width:560px;margin:auto;overflow:hidden;
  box-shadow:0 0 0 1px var(--b);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.scr{
  position:absolute;inset:0;display:none;flex-direction:column;
  padding-top:var(--st);
}
.scr.on{display:flex}
.pad{flex:1;overflow:auto;padding:22px 20px 120px;display:flex;flex-direction:column;gap:12px}
.pad::-webkit-scrollbar{display:none}
.ac{align-items:center;text-align:center}
.w{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}

/* ═══════════════ Auth ═══════════════ */
.logo{
  width:92px;height:92px;border-radius:32px;background:var(--g);
  display:grid;place-items:center;font-size:46px;font-weight:900;color:#fff;
  box-shadow:0 18px 44px rgba(168,85,247,.38);
}
.big{font-size:34px;font-weight:900;letter-spacing:-.5px}
.sub{color:var(--t2);font-size:13px}
.tabs{
  display:flex;gap:4px;padding:4px;background:var(--s1);
  border:1px solid var(--b);border-radius:16px;width:100%;margin-top:8px;
}
.tabs button{flex:1;padding:9px;border-radius:12px;font-weight:700;color:var(--t2)}
.tabs .on{background:var(--g);color:#fff}
#fl,#fr{display:flex;flex-direction:column;gap:12px;width:100%}
.inp{
  text-align:right;width:100%;background:var(--s1);
  border:1.5px solid var(--b);border-radius:16px;padding:13px 16px;
  transition:border-color .2s;
}
.inp:focus{border-color:var(--pu)}
.inp[dir=ltr],.inp[type=tel],.inp[type=password]{direction:ltr}
.btn{
  width:100%;padding:14px;border-radius:16px;background:var(--g);color:#fff;
  font-weight:800;box-shadow:0 10px 26px rgba(168,85,247,.35);
  transition:transform .1s;
}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--s2);color:var(--t);box-shadow:none}
.btn.dg{background:rgba(239,68,68,.14);color:#f87171;box-shadow:none}

/* ═══════════════ Header ═══════════════ */
.hd{display:flex;align-items:center;gap:10px;padding:16px 20px 6px;flex:none}
.hd h1{flex:1;font-size:28px;font-weight:900;letter-spacing:-.5px}
.ib{
  width:42px;height:42px;border-radius:14px;background:var(--s1);
  border:1px solid var(--b);display:grid;place-items:center;
  font-size:18px;flex:none;
}
.ib:active{background:var(--s2)}

/* ═══════════════ Avatar ═══════════════ */
.av{
  width:50px;height:50px;border-radius:18px;background:var(--g);
  display:grid;place-items:center;color:#fff;font-weight:900;
  font-size:19px;flex:none;object-fit:cover;
}
.av.xl{width:100px;height:100px;border-radius:34px;font-size:40px;margin:0 auto}

/* ═══════════════ Chats List ═══════════════ */
#q{margin:6px 20px 10px;width:calc(100% - 40px);flex:none}
#list{flex:1;overflow:auto;padding:0 0 110px}
#list::-webkit-scrollbar{display:none}
.ci{
  display:flex;align-items:center;gap:13px;padding:12px 20px;
  cursor:pointer;transition:background .15s;
}
.ci:active{background:var(--s1)}
.ci+.ci{border-top:1px solid var(--b)}
.ci-i{flex:1;min-width:0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r small,.ch small{color:var(--t2);font-size:11.5px}
.pv{color:var(--t2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{
  background:var(--g);color:#fff;font-style:normal;font-size:11px;font-weight:800;
  min-width:22px;height:22px;padding:0 7px;border-radius:11px;
  display:grid;place-items:center;
}
.em{text-align:center;color:var(--t2);padding:56px 24px}

/* ═══════════════ Favorites ═══════════════ */
#fav-sec{padding:4px 20px 8px;flex:none}
.fav-hd{
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 0 8px;font-size:12px;font-weight:800;color:#FBBF24;
}
.fav-hd span:last-child{font-size:11px;color:var(--t2)}
.fav-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.fav-list::-webkit-scrollbar{display:none}
.fav-chip{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  width:70px;cursor:pointer;position:relative;
}
.fav-chip .av{width:56px;height:56px;border-radius:20px;font-size:22px;border:2px solid #FBBF24}
.fav-chip-n{
  font-size:10.5px;color:var(--t2);font-weight:600;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ═══════════════ Bottom Nav ═══════════════ */
#nav{
  position:absolute;z-index:20;bottom:calc(12px + var(--sb));
  left:16px;right:16px;display:flex;gap:4px;padding:6px;
  background:var(--s1);border:1px solid var(--b);border-radius:24px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}
#nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:6px;border-radius:18px;color:var(--t2);font-size:11px;font-weight:700;
  gap:2px;transition:background .2s,color .2s;
}
#nav button span{font-size:10.5px}
#nav .on{background:var(--g);color:#fff}

/* ═══════════════ Chat Header ═══════════════ */
.ch{
  display:flex;align-items:center;gap:10px;
  margin:8px 12px 0;padding:9px 10px;
  background:var(--s1);border:1px solid var(--b);border-radius:24px;
  flex:none;
}
.ch .av{width:42px;height:42px;border-radius:15px;font-size:17px}
.ch .ci-i{flex:1;min-width:0;text-align:right}
.ch .ib{background:transparent;border:none}

/* ═══════════════ Chat Body ═══════════════ */
#msgs{
  flex:1;overflow:auto;padding:14px 14px 8px;
  display:flex;flex-direction:column;
  -webkit-overflow-scrolling:touch;
}
#msgs::-webkit-scrollbar{display:none}
.day{
  align-self:center;font-size:11px;color:var(--t2);
  background:var(--s1);padding:2px 12px;border-radius:10px;margin:10px 0;
}
.m{
  max-width:80%;padding:9px 13px;margin-bottom:6px;border-radius:20px;
  word-break:break-word;white-space:pre-wrap;
  animation:in .2s;position:relative;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.me{
  align-self:flex-start;background:var(--me);color:#fff;
  border-bottom-right-radius:6px;
  box-shadow:0 6px 20px rgba(124,58,237,.28);
}
.ot{
  align-self:flex-end;background:var(--ot);border:1px solid var(--b);
  border-bottom-left-radius:6px;
}
.mt{
  display:block;text-align:left;font-size:10.5px;opacity:.78;
  font-style:normal;margin-top:2px;white-space:normal;
}
.tk{color:rgba(255,255,255,.85)}
.tk.rd{color:#7dd3fc}
.sn{display:block;font-size:12px;color:#a78bfa;font-weight:800;margin-bottom:3px}
.rq{
  border-right:3px solid var(--cy);background:rgba(127,127,127,.2);
  padding:3px 8px;border-radius:8px;margin-bottom:4px;font-size:12px;
}
.im{max-width:100%;border-radius:14px;display:block;margin-bottom:4px;cursor:pointer}
.m a{color:var(--lk);text-decoration:underline}
.me a{color:#e0f2fe}
.deleted-msg{opacity:.6;font-style:italic}
.edited-mark{font-size:10px;opacity:.75;margin-left:4px}

/* ═══════════════ Voice Messages ═══════════════ */
.voice-msg{
  display:flex;flex-direction:column;gap:6px;
  min-width:220px;padding:12px 14px;
}
.voice-row{display:flex;align-items:center;gap:10px}
.voice-play{
  width:42px;height:42px;border-radius:14px;
  background:var(--g);display:grid;place-items:center;
  color:#fff;flex:none;font-size:16px;
}
.voice-wave{
  flex:1;height:22px;display:flex;align-items:center;gap:2px;
}
.voice-wave span{
  flex:1;background:var(--t3);opacity:.5;border-radius:2px;
  min-height:4px;pointer-events:none;
}
.me .voice-wave span{background:rgba(255,255,255,.5)}
.voice-wave span.played{opacity:1;background:var(--cy)}
.me .voice-wave span.played{background:#fff}
.voice-dur{font-size:11px;opacity:.75;font-family:monospace;font-weight:700}
.voice-track{
  height:22px;padding:8px 0;
  position:relative;cursor:pointer;touch-action:none;
  margin:2px 0;
}
.voice-track::before{
  content:'';position:absolute;left:0;right:0;top:50%;
  height:5px;margin-top:-2.5px;
  background:rgba(255,255,255,.12);border-radius:3px;
  pointer-events:none;
}
.me .voice-track::before{background:rgba(255,255,255,.22)}
.voice-fill{
  position:absolute;top:50%;height:5px;margin-top:-2.5px;
  background:var(--cy);width:0%;border-radius:3px;pointer-events:none;
}
.me .voice-fill{background:#fff}
.voice-thumb{
  position:absolute;top:50%;left:0%;
  width:14px;height:14px;margin-left:-7px;margin-top:-7px;
  border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.55);
  pointer-events:none;transform:scale(.85);
  transition:transform .15s;
}
.voice-track.dragging .voice-thumb{transform:scale(1.3)}
.voice-times{
  display:flex;justify-content:space-between;
  font-size:10.5px;color:#fff;opacity:.85;
  font-family:monospace;font-weight:700;
}

/* ═══════════════ Reply Bar ═══════════════ */
#rb{
  margin:0 12px 8px;padding:8px 12px;
  background:var(--s1);border:1px solid var(--b);
  border-right:4px solid var(--pu);border-radius:14px;
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;font-size:13px;color:var(--t2);flex:none;
}
#rb button{
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.06);
  display:grid;place-items:center;font-size:14px;flex:none;
}
#rb span{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ═══════════════ Composer ═══════════════ */
.cp{
  display:flex;align-items:flex-end;gap:8px;
  padding:8px 12px calc(10px + var(--sb));
  flex:none;background:var(--bg);z-index:10;
}
.cp textarea{
  flex:1;max-height:120px;resize:none;min-width:0;
  background:var(--s1);border:1px solid var(--b);
  border-radius:22px;padding:11px 16px;
  line-height:1.4;
}
.cp textarea::-webkit-scrollbar{display:none}
.cp .ib{background:var(--s1);border:1px solid var(--b)}
.snd{
  width:46px;height:46px;border-radius:17px;
  background:var(--g);color:#fff;font-size:18px;flex:none;
  box-shadow:0 8px 22px rgba(168,85,247,.4);
  transition:transform .1s;
}
.snd:active{transform:scale(.92)}
.snd.rec{background:linear-gradient(135deg,#EF4444,#EC4899)}

/* ═══════════════ Read-Only Banner ═══════════════ */
.ro{
  position:absolute;bottom:calc(14px + var(--sb));left:14px;right:14px;
  padding:14px;background:var(--s1);border:1px solid var(--b);
  border-radius:20px;text-align:center;font-size:13px;
  color:var(--t2);font-weight:700;z-index:30;
}

/* ═══════════════ Recorder Overlay ═══════════════ */
.recov{
  position:absolute;bottom:calc(90px + var(--sb));left:50%;
  transform:translateX(-50%);
  background:var(--s2);border:1px solid rgba(168,85,247,.4);
  color:#fff;padding:14px 20px;border-radius:20px;
  display:flex;align-items:center;gap:14px;
  z-index:200;min-width:260px;max-width:calc(100% - 30px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.rec-dot{
  width:12px;height:12px;background:#EF4444;border-radius:50%;
  animation:blink 1s infinite;flex:none;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.recov #rect{
  font-size:18px;font-weight:800;font-family:monospace;
  min-width:56px;color:#C4B5FD;
}
.recov .rec-h{
  flex:1;font-size:12px;opacity:.75;
  text-align:left;direction:ltr;font-weight:600;
}

/* ═══════════════ Locked Bar ═══════════════ */
.lkbar{
  position:absolute;bottom:0;left:0;right:0;
  padding:12px 14px calc(12px + var(--sb));
  background:linear-gradient(180deg,rgba(11,15,26,.6),rgba(11,15,26,.98));
  backdrop-filter:blur(20px);
  border-top:1px solid var(--b2);
  display:flex;align-items:center;gap:10px;
  z-index:60;color:#fff;
}
.lk-del{
  width:44px;height:44px;border-radius:14px;
  background:rgba(239,68,68,.18);color:#FCA5A5;
  display:grid;place-items:center;flex:none;font-size:16px;
}
.lk-mid{
  flex:1;display:flex;align-items:center;gap:10px;
}
.lk-dot{
  width:10px;height:10px;background:#EF4444;border-radius:50%;
  animation:blink 1s infinite;flex:none;
}
.lkbar #lkt{
  font-size:16px;font-weight:800;font-family:monospace;
  color:#fff;letter-spacing:1px;flex:none;
}
.lk-send{
  width:52px;height:52px;border-radius:18px;
  background:var(--g);color:#fff;
  display:grid;place-items:center;flex:none;
  font-size:18px;box-shadow:0 12px 28px rgba(168,85,247,.55);
}

/* ═══════════════ Sheets ═══════════════ */
.sh{
  position:absolute;inset:0;z-index:50;
  background:rgba(0,0,0,.55);backdrop-filter:blur(5px);
  display:none;align-items:flex-end;
}
.sh.on{display:flex}
.sc{
  width:100%;background:var(--s1);
  border-radius:28px 28px 0 0;
  padding:14px 18px calc(22px + var(--sb));
  display:flex;flex-direction:column;gap:10px;
  max-height:85vh;
  animation:up .25s;
  overflow:hidden;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.hd2{
  width:42px;height:5px;border-radius:3px;
  background:var(--b);margin:0 auto 6px;flex:none;
}

/* ═══════════════ Tile Grid (Settings) ═══════════════ */
.tile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:8px 0;
}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:12px 6px;
  background:var(--s1);border:1px solid var(--b);
  border-radius:16px;position:relative;
  aspect-ratio:1;transition:transform .1s;
}
.tile:active{transform:scale(.95)}
.tile-ic{
  width:36px;height:36px;border-radius:12px;
  display:grid;place-items:center;font-size:18px;color:#fff;
}
.tile-ic.bl{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
.tile-ic.pu{background:linear-gradient(135deg,#A855F7,#7C3AED)}
.tile-ic.pk{background:linear-gradient(135deg,#EC4899,#DB2777)}
.tile-ic.yl{background:linear-gradient(135deg,#F59E0B,#EA580C)}
.tile-ic.rd{background:linear-gradient(135deg,#EF4444,#DC2626)}
.tile-ic.gy{background:linear-gradient(135deg,#4B5563,#374151)}
.tile-t{font-size:11px;font-weight:800;text-align:center;line-height:1.15}
.tile-s{
  position:absolute;top:6px;right:6px;
  font-size:9px;font-weight:800;
  background:linear-gradient(135deg,#FBBF24,#F59E0B);
  color:#0A0E1A;padding:2px 7px;border-radius:8px;
}

/* ═══════════════ Logout Wrap ═══════════════ */
.logout-wrap{padding:14px 0 4px;flex:none}
.logout-tile{
  min-height:52px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  gap:10px!important;
  padding:14px!important;
}

/* ═══════════════ Profile Avatar ═══════════════ */
.pa{
  display:flex;justify-content:center;padding:6px;
  cursor:pointer;flex:none;
}
#sph{margin-bottom:4px}

/* ═══════════════ Toast ═══════════════ */
#toast{
  position:absolute;z-index:99;bottom:120px;left:50%;
  transform:translate(-50%,30px);
  background:var(--s2);border:1px solid var(--b);
  padding:10px 20px;border-radius:16px;
  font-weight:700;font-size:13px;
  opacity:0;pointer-events:none;transition:.3s;
  max-width:90%;text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ═══════════════ Network banner ═══════════════ */
#nc{
  position:absolute;z-index:90;top:0;left:0;right:0;
  padding:calc(var(--st) + 8px) 14px 8px;
  background:#7f1d1d;color:#fecaca;
  font-size:12.5px;text-align:center;cursor:pointer;
}

/* ═══════════════ Media Viewer ═══════════════ */
.vw{
  position:absolute;inset:0;z-index:60;background:#000;
  display:none;align-items:center;justify-content:center;
}
.vw.on{display:flex}
.vw img{max-width:100%;max-height:100%;object-fit:contain}

/* ═══════════════ Emoji Picker ═══════════════ */
.ep{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--s2);
  border-radius:28px 28px 0 0;
  border-top:1px solid var(--b2);
  z-index:100;
  display:flex;flex-direction:column;
  max-height:60vh;
  padding-bottom:var(--sb);
  animation:up .25s;
}
.ep-tb{
  display:flex;align-items:center;gap:8px;
  padding:12px;border-bottom:1px solid var(--b);
}
.ep-pill{
  flex:1;display:flex;
  background:var(--s1);border:1px solid var(--b);
  border-radius:16px;padding:4px;gap:2px;
}
.pill-btn{
  flex:1;padding:8px 10px;border-radius:12px;
  font-size:13px;font-weight:800;
  color:var(--t2);
}
.pill-btn.on{background:var(--g);color:#fff}
.ep-btn{
  width:42px;height:42px;border-radius:14px;
  color:var(--t2);display:grid;place-items:center;
  font-size:18px;flex:none;
}
.ep-cl{
  padding:10px 16px 6px;font-size:12px;
  font-weight:800;color:var(--t2);
}
.ep-g{
  flex:1;overflow-y:auto;
  padding:0 10px 10px;
  display:grid;grid-template-columns:repeat(8,1fr);gap:2px;
}
.ep-g::-webkit-scrollbar{display:none}
.ep-i{
  background:none;font-size:24px;padding:4px;
  border-radius:12px;aspect-ratio:1;
  display:grid;place-items:center;
}
.ep-i:active{background:rgba(255,255,255,.08)}
.ep-bt{
  display:flex;justify-content:space-around;
  padding:6px;background:var(--s1);
  border-top:1px solid var(--b);
}
.ep-bt button{
  padding:8px 12px;border-radius:12px;
  font-size:20px;color:var(--t2);
}
.ep-bt button.on{color:#C4B5FD;background:rgba(168,85,247,.15)}
.gif-search{
  display:flex;align-items:center;gap:8px;
  margin:6px 12px;padding:10px 14px;
  background:var(--s1);border:1px solid var(--b);
  border-radius:14px;flex:none;
}
.gif-search input{
  flex:1;background:none;border:none;
  outline:none;font-size:13px;color:var(--t);
}
.gif-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:6px;padding:0 12px 12px;
}
.gif-item{
  border-radius:12px;overflow:hidden;
  background:var(--s1);aspect-ratio:1.15;cursor:pointer;
}
.gif-item img{width:100%;height:100%;object-fit:cover}
.gif-loading{
  grid-column:1/-1;text-align:center;
  padding:30px;color:var(--t2);font-size:13px;
}
.sticker-item{
  border-radius:16px;aspect-ratio:1;
  display:grid;place-items:center;
  font-size:40px;cursor:pointer;
  transition:transform .15s;
}
.sticker-item:active{transform:scale(.9)}

/* ═══════════════ Info Readers ═══════════════ */
.info-header{
  display:flex;align-items:center;gap:10px;
  padding:4px 0 8px;flex:none;
}
.info-header .ib{background:transparent;border:none}
.info-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:10px 12px;
  background:var(--s2);border:1px solid var(--b);
  border-radius:12px;margin-bottom:6px;
  font-size:12.5px;flex:none;
}
.info-row>span:first-child{color:var(--t2);font-weight:700;flex:none}
.info-row>span:last-child{
  color:var(--t);font-weight:600;text-align:left;
  direction:ltr;font-family:monospace;font-size:12px;
  word-break:break-all;
}
.info-section-title{
  font-size:13px;font-weight:800;color:var(--pu);
  padding:12px 4px 8px;
  margin-top:6px;
  border-top:1px solid var(--b);
  display:flex;align-items:center;gap:8px;
  flex:none;
}
.readers-count{
  background:rgba(168,85,247,.2);color:#C4B5FD;
  padding:2px 9px;border-radius:9px;
  font-size:11.5px;font-weight:800;
  min-width:26px;text-align:center;
}
.readers-scroll{
  max-height:240px;overflow-y:auto;
  background:var(--s2);border:1px solid var(--b);
  border-radius:12px;padding:4px;
  margin-bottom:8px;flex:none;
}
.readers-scroll::-webkit-scrollbar{width:4px}
.readers-scroll::-webkit-scrollbar-thumb{
  background:rgba(168,85,247,.4);border-radius:2px;
}
.reader-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:10px;
}
.reader-item:not(:last-child){
  border-bottom:1px solid rgba(255,255,255,.04);
}
.reader-av{
  width:36px;height:36px;border-radius:12px;
  background-size:cover;background-position:center;
  flex:none;display:grid;place-items:center;
  color:#fff;font-size:14px;
}
.reader-info{flex:1;min-width:0}
.reader-name{
  font-size:13px;font-weight:700;color:var(--t);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.reader-time{
  font-size:11px;color:#86EFAC;font-weight:600;
  margin-top:2px;direction:rtl;
}
.reader-empty,.reader-loading{
  text-align:center;padding:20px;
  color:var(--t2);font-size:12.5px;
  background:var(--s2);border:1px dashed var(--b);
  border-radius:12px;margin-bottom:8px;
}

/* ═══════════════ Search Tabs ═══════════════ */
.search-tabs{
  display:flex;gap:4px;padding:4px;
  background:var(--s2);border:1px solid var(--b);
  border-radius:14px;flex:none;
}
.search-tab{
  flex:1;padding:8px;border-radius:11px;
  font-size:12px;font-weight:800;
  color:var(--t2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.search-tab.on{
  background:var(--g);color:#fff;
  box-shadow:0 4px 12px rgba(168,85,247,.35);
}
.search-sec-title{
  font-size:12px;font-weight:800;color:var(--pu);
  padding:10px 4px 6px;
}
.search-sec-title:first-child{padding-top:2px}

/* ═══════════════ QR ═══════════════ */
.qr-wrap{
  background:#fff;padding:16px;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;max-width:240px;margin:0 auto;
  flex:none;
}
.qr-wrap canvas,.qr-wrap img{border-radius:10px}
.qr-user{
  font-size:14px;font-weight:800;color:#0A0E1A;
  direction:ltr;cursor:pointer;
  padding:4px 10px;border-radius:8px;
  transition:background .2s;
}
.qr-user:active{background:rgba(0,0,0,.08)}
.qr-url{
  font-size:10px;color:#666;direction:ltr;
  text-align:center;word-break:break-all;
  font-family:monospace;
}
.qr-info{
  display:flex;flex-direction:column;align-items:center;
  gap:4px;margin-bottom:8px;flex:none;
}
.qr-info .av{width:70px;height:70px;border-radius:22px;font-size:28px;margin-bottom:6px}
.qr-info .name{font-size:17px;font-weight:900;color:var(--t)}
.qr-info .username{font-size:12px;color:var(--t2);font-weight:700;direction:ltr}
.qr-scan-box{
  width:100%;aspect-ratio:1;background:#000;
  border-radius:16px;overflow:hidden;
  margin-bottom:10px;position:relative;flex:none;
}
.qr-scan-box video{width:100%;height:100%;object-fit:cover}
.qr-scan-box #qr-reader{width:100%;height:100%}
.qr-scan-box #qr-reader__dashboard{display:none!important}
.qr-gallery{
  width:100%;padding:18px;background:var(--s2);
  border:2px dashed var(--b2);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;text-align:center;flex:none;
}
.qr-gallery svg{width:36px;height:36px;color:var(--pu);opacity:.7}
.qr-gallery-title{font-size:13px;font-weight:800}

/* ═══════════════ Dropdown (chat options) ═══════════════ */
.cdd{
  position:absolute;
  top:calc(var(--st) + 78px);left:14px;
  background:var(--s2);
  border:1px solid var(--b2);border-radius:18px;
  padding:6px;z-index:150;
  min-width:220px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
  display:none;
}
.cdd.on{display:block}
.cdd-i{
  display:block;width:100%;text-align:right;
  padding:11px 14px;border-radius:11px;
  font-size:13.5px;font-weight:600;
}
.cdd-i:active{background:rgba(168,85,247,.15)}
.cdd-i.dng{color:#FCA5A5}

/* ═══════════════ Msg Menu (long press) ═══════════════ */
.mm{
  position:absolute;z-index:300;
  background:var(--s2);
  border:1px solid var(--b2);border-radius:18px;
  padding:6px;min-width:210px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  display:none;
}
.mm.on{display:block}
.mm-react{
  display:flex;justify-content:space-around;
  padding:10px 6px;gap:2px;
  border-bottom:1px solid var(--b);
}
.mm-react button{
  width:38px;height:38px;border-radius:50%;
  background:var(--s1);font-size:20px;
  display:grid;place-items:center;
}
.mm-react button:active{background:rgba(168,85,247,.2)}
.mm-i{
  display:block;width:100%;text-align:right;
  padding:11px 14px;border-radius:11px;
  font-size:13.5px;font-weight:600;
}
.mm-i:active{background:rgba(168,85,247,.15)}
.mm-i.dng{color:#FCA5A5}

/* ═══════════════ Reactions ═══════════════ */
.reactions{
  display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;
}
.reactions span{
  background:rgba(255,255,255,.12);border-radius:9px;
  padding:2px 6px;font-size:11.5px;
}
.me .reactions span{background:rgba(255,255,255,.22)}

/* ═══════════════ Call Log ═══════════════ */
.call-log{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px!important;min-width:200px;
}
.call-icon{
  width:38px;height:38px;border-radius:13px;
  display:grid;place-items:center;
  background:rgba(6,182,212,.2);color:#22D3EE;
  font-size:18px;flex:none;
}
.call-icon.missed{background:rgba(239,68,68,.2);color:#FCA5A5}
.call-icon.video{background:rgba(168,85,247,.2);color:#C4B5FD}
.call-info{flex:1;text-align:right}
.call-title{font-size:13px;font-weight:800}
.call-sub{font-size:11px;color:#fff;opacity:.85;margin-top:2px}
.call-sub.missed{color:#FCA5A5;opacity:1;font-weight:700}

/* ═══════════════ Reduced Motion ═══════════════ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div id="app">

<!-- ═══════════════ AUTH ═══════════════ -->
<section id="auth" class="scr on"><div class="pad ac"><div class="w">
 <div class="logo">N</div><h1 class="big">Novira</h1><p class="sub">رسائل بسيطة وسريعة</p>
 <div class="tabs"><button class="on" data-a="au" data-t="l" type="button">دخول</button><button data-a="au" data-t="r" type="button">حساب جديد</button></div>
 <div id="fl">
  <input id="lp" class="inp" type="tel" placeholder="رقم الهاتف" autocomplete="tel">
  <input id="lk" class="inp" type="password" inputmode="numeric" maxlength="6" placeholder="رمز الدخول (6 أرقام)">
  <button class="btn" data-a="li" type="button">دخول</button>
 </div>
 <div id="fr" hidden>
  <input id="rn" class="inp" placeholder="الاسم" maxlength="30">
  <input id="ru" class="inp" dir="ltr" placeholder="username" maxlength="20" autocapitalize="off" spellcheck="false">
  <input id="rp" class="inp" type="tel" placeholder="رقم الهاتف">
  <input id="rk" class="inp" type="password" inputmode="numeric" maxlength="6" placeholder="رمز الدخول (6 أرقام)">
  <button class="btn" data-a="rg" type="button">إنشاء الحساب</button>
 </div>
</div></div></section>

<!-- ═══════════════ HOME ═══════════════ -->
<section id="home" class="scr">
 <div class="hd"><h1>الدردشات</h1><button class="ib" data-a="new" type="button" aria-label="محادثة جديدة">✎</button></div>
 <input id="q" class="inp" placeholder="ابحث في المحادثات">
 <div id="fav-sec" hidden>
   <div class="fav-hd"><span>★ المفضلة</span><span id="fav-count"></span></div>
   <div id="fav-list" class="fav-list"></div>
 </div>
 <div id="list"></div>
</section>

<!-- ═══════════════ SETTINGS ═══════════════ -->
<section id="set" class="scr"><div class="pad">
 <label class="pa"><span id="sa"></span><input id="fa" type="file" accept="image/*" hidden></label>
 <p id="sph" class="sub" style="text-align:center"></p>
 <div class="tile-grid">
   <button class="tile" data-a="qr" type="button"><span class="tile-ic bl">▣</span><span class="tile-t">رمزي</span></button>
   <button class="tile" data-a="edit" type="button"><span class="tile-ic pu">✎</span><span class="tile-t">تعديل</span></button>
   <button class="tile" data-a="fav" type="button"><span class="tile-ic pk">★</span><span class="tile-t">المفضلة</span><span class="tile-s" id="fav-tile" hidden>0</span></button>
   <button class="tile" data-a="mic" type="button"><span class="tile-ic yl">🎤</span><span class="tile-t">ميكروفون</span></button>
   <button class="tile" data-a="blk" type="button"><span class="tile-ic rd">⊘</span><span class="tile-t">محظورون</span></button>
   <button class="tile" data-a="th" type="button"><span class="tile-ic gy">◐</span><span class="tile-t">المظهر</span></button>
 </div>
 <div class="logout-wrap">
   <button class="btn dg logout-tile" data-a="lo" type="button">🚪 تسجيل الخروج</button>
 </div>
 <button class="btn dg" data-a="del" type="button" style="margin-top:8px">🗑️ حذف الحساب نهائياً</button>
</div></section>

<!-- ═══════════════ CHAT ═══════════════ -->
<section id="chat" class="scr">
 <div class="ch">
   <button class="ib" data-a="back" type="button" aria-label="رجوع">→</button>
   <span id="ca"></span>
   <div class="ci-i"><b id="cn"></b><br><small id="cs"></small></div>
   <button class="ib" data-a="cmenu" type="button" aria-label="خيارات">⋯</button>
 </div>
 <div id="msgs"></div>
 <div id="rb" hidden></div>
 <div class="cp" id="comp">
  <button class="ib" data-a="emoji" type="button" aria-label="إيموجي">😀</button>
  <label class="ib" aria-label="إرفاق صورة">📎<input id="fi" type="file" accept="image/*" hidden></label>
  <textarea id="in" rows="1" placeholder="اكتب رسالة…"></textarea>
  <button class="snd" data-a="send" type="button" aria-label="إرسال">➤</button>
 </div>
 <div id="ro" class="ro" hidden>🔒 لا يمكنك الكتابة</div>
 <div id="recov" class="recov" hidden>
   <span class="rec-dot"></span>
   <span id="rect">0:00</span>
   <span class="rec-h">اسحب للأعلى للقفل</span>
 </div>
 <div id="lkbar" class="lkbar" hidden>
   <button class="lk-del" data-a="cancel-rec" type="button">🗑️</button>
   <div class="lk-mid">
     <span class="lk-dot"></span>
     <span id="lkt">0:00</span>
   </div>
   <button class="lk-send" data-a="send-rec" type="button">➤</button>
 </div>
 <div class="cdd" id="cdd">
   <button class="cdd-i" data-a="call-v" type="button">📞 مكالمة صوتية</button>
   <button class="cdd-i" data-a="call-vi" type="button">📹 مكالمة فيديو</button>
   <button class="cdd-i" data-a="fav-chat" type="button" id="fav-toggle-item">⭐ <span>إضافة للمفضلة</span></button>
   <button class="cdd-i" data-a="info" type="button">👤 عرض الملف</button>
   <button class="cdd-i" data-a="ginfo" type="button" id="grp-info-btn" style="display:none">ℹ️ معلومات المجموعة</button>
   <button class="cdd-i dng" data-a="block" type="button">🚫 حظر</button>
 </div>
</section>

<!-- ═══════════════ NAV ═══════════════ -->
<nav id="nav" hidden>
 <button class="on" data-a="tab" data-t="home" type="button">💬<span>الدردشات</span></button>
 <button data-a="tab" data-t="set" type="button">⚙️<span>حسابي</span></button>
</nav>

<!-- ═══════════════ MESSAGE MENU (long press) ═══════════════ -->
<div id="mm" class="mm">
 <div class="mm-react">
  <button data-a="react" data-r="👍" type="button">👍</button>
  <button data-a="react" data-r="❤️" type="button">❤️</button>
  <button data-a="react" data-r="😂" type="button">😂</button>
  <button data-a="react" data-r="😮" type="button">😮</button>
  <button data-a="react" data-r="😢" type="button">😢</button>
  <button data-a="react" data-r="🙏" type="button">🙏</button>
 </div>
 <button class="mm-i" data-a="m-reply" type="button">↩️ رد</button>
 <button class="mm-i" data-a="m-copy" type="button">📋 نسخ</button>
 <button class="mm-i" data-a="m-forward" type="button">↗️ توجيه</button>
 <button class="mm-i" id="menu-edit-btn" data-a="m-edit" type="button" style="display:none">✏️ تعديل</button>
 <button class="mm-i" data-a="m-info" type="button">ℹ️ معلومات</button>
 <button class="mm-i dng" data-a="m-delete" type="button">🗑️ حذف</button>
</div>

<!-- ═══════════════ SHEETS ═══════════════ -->
<div id="sh" class="sh"></div>

<!-- ═══════════════ EMOJI PICKER ═══════════════ -->
<div id="emoji-picker" class="ep" hidden>
  <div class="ep-tb">
    <div class="ep-pill">
      <button class="pill-btn on" data-ep="emoji" type="button">😀</button>
      <button class="pill-btn" data-ep="gif" type="button">GIF</button>
      <button class="pill-btn" data-ep="sticker" type="button">🎨</button>
    </div>
    <button class="ep-btn" data-a="bsp" type="button">⌫</button>
  </div>
  <div class="ep-cl" id="ep-cat">إيموجي</div>
  <div class="ep-g" id="emoji-grid"></div>
  <div class="ep-bt" id="emoji-tabs"></div>
</div>

<!-- ═══════════════ VIEWER + TOAST + NETWORK ═══════════════ -->
<div id="vw" class="vw" onclick="this.classList.remove('on')"></div>
<div id="nc" hidden onclick="this.hidden=true"></div>
<div id="toast"></div>

<!-- ═══════════════ HIDDEN INPUTS ═══════════════ -->
<input type="file" id="file-qr-scan" accept="image/*" hidden>

</div><!-- /#app -->

<script src="app.js"></script>
</body>
</html>
