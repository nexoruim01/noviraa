name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ || echo "no platforms"
          ls $ANDROID_HOME/build-tools/ || echo "no build-tools"

      - name: Install missing SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --no-fund --no-audit @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/

      - name: Init Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init Novira com.novira.app --web-dir=www
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Copy AudioRoutePlugin
        run: |
          if [ -f android-plugin/AudioRoutePlugin.java ]; then
            mkdir -p android/app/src/main/java/com/novira/app
            cp android-plugin/AudioRoutePlugin.java android/app/src/main/java/com/novira/app/
          fi

      - name: Setup MainActivity
        run: |
          MAIN=android/app/src/main/java/com/novira/app/MainActivity.java
          mkdir -p android/app/src/main/java/com/novira/app
          cat > $MAIN << 'EOF'
          package com.novira.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioRoutePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Add permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "RECORD_AUDIO" $MANIFEST; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon > full_build.log 2>&1
          EXIT_CODE=$?
          echo "════════════════════════════════════════"
          echo "🔍 الخطأ الحقيقي:"
          echo "════════════════════════════════════════"
          grep -B 2 -A 25 "What went wrong" full_build.log || echo "no 'What went wrong' found"
          echo ""
          echo "════════════════════════════════════════"
          echo "🔍 آخر 40 سطر:"
          echo "════════════════════════════════════════"
          tail -40 full_build.log
          exit $EXIT_CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: novira-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30