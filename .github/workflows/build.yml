name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --no-fund --no-audit @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init Novira com.novira.app --web-dir=www
          fi

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Create AudioRoutePlugin
        run: |
          mkdir -p android/app/src/main/java/com/novira/app
          cat > android/app/src/main/java/com/novira/app/AudioRoutePlugin.java << 'JAVAEOF'
          package com.novira.app;
          import android.content.Context;
          import android.media.AudioManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "AudioRoute")
          public class AudioRoutePlugin extends Plugin {
              private AudioManager audioManager;
              @Override
              public void load() {
                  audioManager = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              }
              @PluginMethod
              public void setEarpiece(PluginCall call) {
                  try {
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audioManager.setSpeakerphoneOn(false);
                      JSObject ret = new JSObject();
                      ret.put("route", "earpiece");
                      call.resolve(ret);
                  } catch (Exception e) { call.reject("fail: " + e.getMessage()); }
              }
              @PluginMethod
              public void setSpeaker(PluginCall call) {
                  try {
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                      audioManager.setSpeakerphoneOn(true);
                      JSObject ret = new JSObject();
                      ret.put("route", "speaker");
                      call.resolve(ret);
                  } catch (Exception e) { call.reject("fail: " + e.getMessage()); }
              }
              @PluginMethod
              public void resetMode(PluginCall call) {
                  try {
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                      audioManager.setSpeakerphoneOn(false);
                      call.resolve();
                  } catch (Exception e) { call.reject("fail: " + e.getMessage()); }
              }
          }
          JAVAEOF

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/novira/app/MainActivity.java << 'JAVAEOF'
          package com.novira.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioRoutePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF

      - name: Add permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "RECORD_AUDIO" $MANIFEST; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Fix Kotlin duplicate class issue
        run: |
          ROOT_GRADLE=android/build.gradle
          cat > /tmp/root_fix.txt << 'KOTLINEOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          KOTLINEOF
          cat $ROOT_GRADLE >> /tmp/root_fix.txt
          mv /tmp/root_fix.txt $ROOT_GRADLE
          echo "=== ROOT build.gradle ==="
          cat $ROOT_GRADLE

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        if: always()
        run: |
          echo "========== SEARCHING FOR APK =========="
          find android -name "*.apk" -type f 2>/dev/null
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "no apk yet"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: novira-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30