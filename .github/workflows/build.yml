name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --no-fund --no-audit @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/

      - name: Init Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init Novira com.novira.app --web-dir=www
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Copy AudioRoutePlugin
        run: |
          if [ -f android-plugin/AudioRoutePlugin.java ]; then
            mkdir -p android/app/src/main/java/com/novira/app
            cp android-plugin/AudioRoutePlugin.java android/app/src/main/java/com/novira/app/
          fi

      - name: Setup MainActivity
        run: |
          MAIN=android/app/src/main/java/com/novira/app/MainActivity.java
          mkdir -p android/app/src/main/java/com/novira/app
          cat > $MAIN << 'EOF'
          package com.novira.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioRoutePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Add permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "RECORD_AUDIO" $MANIFEST; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST
          fi

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novira-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30