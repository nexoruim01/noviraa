- name: Build APK
  run: |
    cd android
    chmod +x gradlew
    set +e
    ./gradlew assembleDebug --no-daemon --stacktrace > full_build.log 2>&1
    EXIT_CODE=$?
    echo "════════════════════════════════════════"
    echo "🔍 الخطأ الحقيقي:"
    echo "════════════════════════════════════════"
    grep -B 2 -A 25 "What went wrong" full_build.log || echo "لم يُعثر على 'What went wrong'"
    echo ""
    echo "════════════════════════════════════════"
    echo "🔍 FAILURE section:"
    echo "════════════════════════════════════════"
    grep -B 2 -A 15 "FAILURE:" full_build.log || true
    echo ""
    echo "════════════════════════════════════════"
    echo "🔍 آخر 40 سطر:"
    echo "════════════════════════════════════════"
    tail -40 full_build.log
    exit $EXIT_CODE