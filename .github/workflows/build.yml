name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --no-fund --no-audit @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init Novira com.novira.app --web-dir=www
          fi

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Setup Files
        run: |
          mkdir -p android/app/src/main/java/com/novira/app
          if [ -f android-plugin/AudioRoutePlugin.java ]; then
            cp android-plugin/AudioRoutePlugin.java android/app/src/main/java/com/novira/app/
          fi
          printf '%s\n' \
            'package com.novira.app;' \
            'import android.os.Bundle;' \
            'import com.getcapacitor.BridgeActivity;' \
            'public class MainActivity extends BridgeActivity {' \
            '    @Override' \
            '    public void onCreate(Bundle savedInstanceState) {' \
            '        registerPlugin(AudioRoutePlugin.class);' \
            '        super.onCreate(savedInstanceState);' \
            '    }' \
            '}' > android/app/src/main/java/com/novira/app/MainActivity.java
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "RECORD_AUDIO" $MANIFEST; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        id: build_step
        continue-on-error: true
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build-output.txt
          echo "EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Show Build Output
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD OUTPUT (first 80 lines)"
          echo "=========================================="
          head -80 build-output.txt || echo "no output file"
          echo ""
          echo "=========================================="
          echo "BUILD OUTPUT (last 80 lines)"
          echo "=========================================="
          tail -80 build-output.txt || echo "no output file"

      - name: Upload APK
        if: success() && steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: novira-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30